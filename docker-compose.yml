# Training, Attendance & Assessment Service — PostgreSQL + Prisma + NestJS API + Next.js web UI
#
#   docker compose up -d --build   # everything: database -> migrations -> API -> web
#   docker compose up -d db        # database only (run the API / web on your machine)
#
# Values come from ./.env (see .env.example); every one has a working default.
name: attendance-service

x-db-url: &db-url postgresql://${POSTGRES_USER:-attendance}:${POSTGRES_PASSWORD:-attendance_dev_password}@db:5432/${POSTGRES_DB:-attendance_service}?schema=public

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-attendance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendance_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-attendance_service}
    ports:
      - '${POSTGRES_PORT:-5435}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # One-shot job: applies pending Prisma migrations, then exits.
  migrate:
    build:
      context: ./back-end
      target: build
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *db-url
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: ./back-end
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      DATABASE_URL: *db-url
    ports:
      - '${PORT:-4000}:4000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Next.js UI. Its server talks to the API over the compose network; the browser only
  # ever talks to this service.
  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:4000
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/icon.svg').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
